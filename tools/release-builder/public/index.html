<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InternalBeyond · Release Builder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23131a28'/%3E%3Cpath d='M9 22V10h2.6v12H9zm5.6 0V10h5.2c2.6 0 4.2 1.3 4.2 3.4 0 1.5-.8 2.5-2.1 3 1.6.4 2.6 1.4 2.6 3.1 0 2.4-1.8 3.5-4.6 3.5h-5.3zm2.6-7.1h2.3c1.2 0 1.9-.5 1.9-1.5s-.7-1.4-1.9-1.4h-2.3v2.9zm0 5h2.6c1.3 0 2.1-.5 2.1-1.6 0-1-.8-1.5-2.1-1.5h-2.6v3.1z' fill='%23cbd5e8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="builder.css">
</head>
<body data-status="IDLE" data-running="false">

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">IB</span>
    <div class="brand-text">
      <h1>InternalBeyond</h1>
      <p>Release Builder</p>
    </div>
  </div>

  <div class="version-line">
    <div class="vblock">
      <span class="vlabel">当前版本</span>
      <span class="vvalue" id="v-current">—</span>
    </div>
    <span class="varrow" aria-hidden="true">→</span>
    <div class="vblock">
      <label class="vlabel" for="target">目标版本</label>
      <input id="target" class="vinput" type="text" inputmode="numeric" spellcheck="false"
             autocomplete="off" placeholder="1.0.6">
    </div>
    <div class="vblock vblock-channel">
      <span class="vlabel">通道</span>
      <div class="seg" role="radiogroup" aria-label="发布通道">
        <button type="button" class="seg-item is-on" role="radio" aria-checked="true">Stable</button>
      </div>
    </div>
  </div>

  <div class="verdict">
    <div class="chip" id="status-chip">
      <span class="chip-dot" aria-hidden="true"></span>
      <span class="chip-text" id="status-text">未开始</span>
    </div>
    <div class="repo-line" id="repo-line">—</div>
  </div>
</header>

<main class="page">

  <!-- ① 流程 ─────────────────────────────────────────────────────────────── -->
  <section class="flow" id="pipeline" aria-label="发布流程">
    <ol class="flow-steps" id="flow-steps"></ol>
    <div class="flow-sep">
      <span class="flow-sep-line"></span>
      <span class="flow-sep-text">以下动作在 GitHub 上公开，永不自动执行</span>
      <span class="flow-sep-line"></span>
    </div>
    <button type="button" class="flow-publish" id="btn-publish">
      <span class="fp-dot" aria-hidden="true"></span>
      <span class="fp-name">发布到 GitHub</span>
      <span class="fp-hint" id="publish-hint">独立确认</span>
    </button>
  </section>

  <!-- ② 主状态区 ─────────────────────────────────────────────────────────── -->
  <section class="panels" id="panels">
    <div class="card status-card" id="card-status">
      <div class="card-head">
        <h2>发行状态</h2>
        <span class="head-note" id="status-note">尚未开始</span>
      </div>
      <dl class="facts" id="facts"></dl>
    </div>

    <div class="card result-card" id="card-result" hidden>
      <div class="card-head">
        <h2 id="result-title">发行产物</h2>
        <span class="head-note" id="result-note"></span>
      </div>
      <div class="artifact" id="artifact"></div>
    </div>

    <!-- ③ 需要处理：每条都是一个人能直接照做的问题 -->
    <section class="alerts" id="alerts" hidden aria-live="polite"></section>
  </section>

  <!-- ④ 主操作 ───────────────────────────────────────────────────────────── -->
  <footer class="dock">
    <div class="dock-main">
      <button type="button" class="btn big primary" id="btn-build">构建 Release</button>
      <button type="button" class="btn" id="btn-check">检查</button>
      <button type="button" class="btn" id="btn-open-dist">打开 dist</button>
      <button type="button" class="btn" id="btn-notes">编辑发行说明</button>
      <button type="button" class="btn quiet" id="btn-dry">预演（不写任何文件）</button>
      <button type="button" class="btn" id="btn-cancel" hidden>取消</button>
      <button type="button" class="btn quiet" id="btn-reset">重置</button>
    </div>
    <div class="dock-hint" id="dock-hint">Ctrl+Enter 运行构建</div>
  </footer>

  <!-- ⑤ 详细日志（默认收起） ─────────────────────────────────────────────── -->
  <section class="logbar">
    <button type="button" class="logbar-head" id="logbar-head" aria-expanded="false" aria-controls="logbar-body">
      <span class="caret" aria-hidden="true"></span>
      <span>详细日志</span>
      <span class="logbar-meta" id="logbar-meta">0 行</span>
    </button>
    <div class="logbar-body" id="logbar-body" hidden>
      <div class="logbar-tools">
        <button type="button" class="btn tiny" id="btn-export">导出日志</button>
        <button type="button" class="btn tiny" id="btn-copy">复制全部</button>
        <span class="spacer"></span>
        <label class="tiny-toggle"><input type="checkbox" id="log-follow" checked> 自动跟随</label>
        <label class="tiny-toggle"><input type="checkbox" id="log-verbose"> 含事件明细</label>
      </div>
      <div class="logbar-view" id="log-view" tabindex="0" role="log" aria-label="详细日志"></div>
    </div>
  </section>

  <!-- ⑥ 发行说明编辑（覆盖层） ───────────────────────────────────────────── -->
  <div class="modal" id="notes-modal" hidden>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="notes-title">
      <div class="modal-head">
        <h2 id="notes-title">发行说明</h2>
        <code class="modal-path" id="notes-path"></code>
      </div>
      <p class="modal-note" id="notes-note"></p>
      <textarea id="notes-text" class="notes-text" spellcheck="false" aria-label="发行说明正文"></textarea>
      <p class="modal-note quiet" id="notes-foot">
        保存即写入上面这个 canonical 文件（LF 换行）。构建会把它读进清单的 notes 字段，校验会比对两者是否一致。
      </p>
      <div class="modal-actions">
        <button type="button" class="btn primary" id="btn-notes-save">保存</button>
        <button type="button" class="btn quiet" id="btn-notes-cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- ⑦ 发布确认（逐项 + fingerprint 绑定） ──────────────────────────────── -->
  <div class="modal" id="publish-modal" hidden>
    <div class="modal-panel wide" role="dialog" aria-modal="true" aria-labelledby="publish-title">
      <div class="modal-head">
        <h2 id="publish-title">发布到 GitHub</h2>
        <span class="modal-path" id="publish-fingerprint"></span>
      </div>
      <p class="modal-note" id="publish-summary"></p>
      <div id="publish-blockers"></div>
      <ul class="pub-actions" id="publish-actions"></ul>
      <label class="pub-confirm">
        <input type="checkbox" id="publish-confirm">
        <span>我已核对上面的产物指纹（文件名 / 大小 / SHA256），并确认执行已勾选的动作。</span>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn danger" id="btn-do-publish" disabled>执行已勾选的动作</button>
        <button type="button" class="btn quiet" id="btn-publish-cancel">取消</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</main>

<script src="app.js"></script>
</body>
</html>
